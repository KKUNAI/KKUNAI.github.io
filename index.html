<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이수찬 | 자기소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f4;--surface:#fff;--ink:#12161c;--sub:#57606c;--accent:#2347ff;--ph:#dde2e8;--line:#cfd6de}
@media (prefers-color-scheme:dark){:root{--paper:#0f1216;--surface:#171b21;--ink:#eef1f4;--sub:#9aa4b2;--accent:#7b93ff;--ph:#232932;--line:#2b323c}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.75;word-break:keep-all}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
.hero{padding:clamp(3.5rem,12vw,8rem) 0 clamp(2rem,6vw,4rem)}
h1{font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif;font-weight:400;font-size:clamp(2.2rem,7.5vw,5.2rem);line-height:1.2;max-width:15em}
.hero p{margin-top:1.25rem;color:var(--sub);font-size:1.1rem}
section{margin-top:clamp(3rem,8vw,5.5rem)}
h2{font-size:1.6rem;font-weight:700;margin-bottom:1.5rem}
.ph{position:relative;display:grid;place-items:center;background:var(--ph);color:var(--sub);font-size:.85rem;text-align:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.work{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:center}
.work .shots{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.work .shots .ph{aspect-ratio:3/4;border-radius:12px}
.work .shots .ph:nth-child(2){margin-top:2rem}
.jobs{list-style:none;padding:0;display:grid;gap:1.2rem}
.jobs li{padding-left:1.1rem;border-left:4px solid var(--accent)}
.jobs b{display:block;font-size:1.15rem}
.jobs span{color:var(--sub)}
.likes{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.likes figure .ph{aspect-ratio:4/3;border-radius:12px}
.likes figcaption{margin-top:.6rem;font-weight:500}
.insta{margin-top:2rem;display:grid;grid-template-columns:1fr minmax(280px,420px);gap:1.5rem;align-items:center}
.insta h3{font-size:1.2rem;margin-bottom:.4rem}
.insta p{color:var(--sub)}
.btn{display:inline-block;margin-top:1rem;padding:.7rem 1.3rem;border-radius:99px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700}
.btn:hover{background:var(--accent);color:#fff}
.insta iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.trips{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;align-items:start}
.view{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:14px;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .35s ease}
.slide{flex:0 0 100%;height:100%}
.nav{position:absolute;top:50%;translate:0 -50%;width:2.4rem;height:2.4rem;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:1.4rem;line-height:1;cursor:pointer}
.prev{left:.6rem}.next{right:.6rem}
.dots{position:absolute;bottom:.6rem;left:0;right:0;display:flex;justify-content:center;gap:.4rem}
.dots button{width:.55rem;height:.55rem;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
.dots button.on{background:#fff;width:1.3rem;border-radius:99px}
.tbody{padding:1rem .2rem 0}
.tbody h3{display:flex;align-items:center;gap:.6rem;font-size:1.25rem;margin-bottom:.5rem}
.tbody h3 i{font-style:normal;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accent);color:#fff;font-size:.95rem}
.tbody p{color:var(--sub)}
footer{margin-top:5rem;padding:2rem 0 3rem;border-top:1px solid var(--line);color:var(--sub);font-size:.9rem}
@media (max-width:820px){.work,.insta,.trips{grid-template-columns:1fr}.trips{gap:2.5rem}.insta iframe{height:440px}}
@media (max-width:520px){.likes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.track{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <h1>안녕하세요, 1청 2팀 사역순장 99또래 이수찬입니다-!!</h1>
</div></header>

<main class="wrap">
  <section id="work">
    <div class="work">
      <div class="shots">
        <div class="ph"><img src="images/work-1.jpg" alt="업무 사진 1" onerror="this.remove()"><span>사진 추가 예정</span></div>
        <div class="ph"><img src="images/work-2.jpg" alt="업무 사진 2" onerror="this.remove()"><span>사진 추가 예정</span></div>
      </div>
      <div>
        <h2>하는 일</h2>
        <ul class="jobs">
          <li><b>분당우리교회 1청 2팀 사역순장</b><span>1청 2팀의 사역과 연합예배의 사진을 맡고 있어요!</span></li>
          <li><b>기아 품질관리 매니저</b><span>PV5라는 자동차를 맡아서 품질 향상에 힘썼어요!</span></li>
          <li><b>현재 하는 것</b><span>품질 데이터 표준화라는 프로젝트를 맡아서 본사로 파견을 와 있는 상태에요!</span></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="likes">
    <h2>좋아하는 것</h2>
    <div class="likes">
      <figure><div class="ph"><img src="images/hobby-photo.jpg" alt="사진 취미" onerror="this.remove()"><span>사진 추가 예정</span></div><figcaption>사진</figcaption></figure>
      <figure><div class="ph"><img src="images/hobby-cook.jpg" alt="요리 취미" onerror="this.remove()"><span>사진 추가 예정</span></div><figcaption>요리</figcaption></figure>
    </div>
    <div class="insta">
      <div>
        <h3>찍은 사진은 인스타그램에서 볼 수 있어요</h3>
        <p>@such_a_nlee</p>
        <a class="btn" href="https://www.instagram.com/such_a_nlee/" target="_blank" rel="noopener">인스타그램 열기</a>
      </div>
      <iframe src="https://www.instagram.com/such_a_nlee/embed" title="인스타그램 such_a_nlee" loading="lazy" scrolling="no"></iframe>
    </div>
  </section>

  <section id="trips">
    <h2>다녀온 곳</h2>
    <div class="trips" id="tripList"></div>
  </section>
</main>

<footer><div class="wrap">© 이수찬</div></footer>

<script>
// 여행 사진은 images 폴더에 올린 뒤 파일 경로를 photos 배열에 추가하세요.
// 예: photos: ['images/japan-1.jpg', 'images/japan-2.jpg']
const TRIPS = [
  { no: 1, place: '일본', photos: [],
    text: '취업하고 처음으로 대학교 시절 친구들과 일본 여행을 갔어요! 제가 일본어를 좀 할 줄 알아서 가볍게 통역하면서 처음으로 오마카세도 먹어보고, 원하는 옷가게들 가서 쇼핑도 하고 즐거웠습니다!' },
  { no: 2, place: '부산', photos: [],
    text: '부산은 여자친구랑 처음으로 여행을 간 곳이에요! 미쉐린 가이드 나왔던 국밥, 장어덮밥도 먹었고 광안리에서 유람선도 타보고, 즐거웠던 여행이었습니다 ㅎㅎ' },
  { no: 3, place: '슬로바키아', photos: [],
    text: '여긴 사실 여행은 아니고 출장이었지만, 처음으로 유럽을 가 본 경험이어서 기억에 남았습니다! 넓게 뻗은 평원 사이에서 출퇴근 하는 경험과 점심에 매점에서 구워주는 피자를 먹는 경험, 주말에는 오스트리아로 잠시 여행을 다녀오며(물론 직장 동료분들과.....) 벨베데레 궁전도 가보고 슈테판 대성당도 가보고 행복했습니다!!' }
];

const list = document.getElementById('tripList');
TRIPS.forEach(t => {
  const slides = t.photos.length ? t.photos : [null];
  const el = document.createElement('article');
  el.innerHTML =
    '<div class="view"><div class="track">' +
    slides.map(s => '<div class="slide ph">' +
      (s ? '<img src="' + s + '" alt="' + t.place + ' 사진" onerror="this.remove()">' : '') +
      '<span>' + t.place + ' 사진을<br>추가해 주세요</span></div>').join('') +
    '</div>' +
    (slides.length > 1 ? '<button class="nav prev" aria-label="이전 사진">‹</button><button class="nav next" aria-label="다음 사진">›</button><div class="dots"></div>' : '') +
    '</div><div class="tbody"><h3><i>' + t.no + '</i>' + t.place + '</h3><p>' + t.text + '</p></div>';
  list.appendChild(el);

  if (slides.length < 2) return;
  const track = el.querySelector('.track'), dots = el.querySelector('.dots'), view = el.querySelector('.view');
  let i = 0, x0 = null;
  const go = n => {
    i = (n + slides.length) % slides.length;
    track.style.transform = 'translateX(-' + (i * 100) + '%)';
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  };
  slides.forEach((_, k) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', (k + 1) + '번째 사진');
    b.onclick = () => go(k);
    dots.appendChild(b);
  });
  el.querySelector('.prev').onclick = () => go(i - 1);
  el.querySelector('.next').onclick = () => go(i + 1);
  view.addEventListener('pointerdown', e => { x0 = e.clientX; });
  view.addEventListener('pointerup', e => {
    if (x0 !== null && Math.abs(e.clientX - x0) > 40) go(i + (e.clientX < x0 ? 1 : -1));
    x0 = null;
  });
  go(0);
});
</script>
</body>
</html>
